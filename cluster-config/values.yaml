# Users granted cluster-admin through the `cluster-config` ApplicationSet.
# Each entry renders one ClusterRoleBinding named
# `cluster-admin-<user>`; removing an entry prunes that binding and revokes
# access on the next automated sync.
#
# Entries must be Kubernetes usernames that are also valid in a DNS-1123
# resource name (lowercase alphanumeric, '-', or '.'); IdP-qualified names
# such as "user@domain" need a sanitized binding-name scheme first.
