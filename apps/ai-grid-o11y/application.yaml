apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-grid-o11y
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/adamrdrew/ai-grid-tenant.git
    targetRevision: lab/aig1-hub-catalog
    path: apps/ai-grid-o11y/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: open-cluster-management-observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      refresh: true
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
