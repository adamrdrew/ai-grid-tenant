spec:
  length: 48
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-db
  namespace: maas-db
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshPolicy: CreatedOnce
  refreshInterval: 0s
  target:
    name: keycloak-db
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/basic-auth
      engineVersion: v2
      mergePolicy: Merge
      data:
        username: keycloak
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: keycloak-db-password
      rewrite:
        - regexp:
            source: ^password$
            target: password
