apiVersion: v1
kind: ServiceAccount
metadata:
  name: keycloak-public-url-templating
  annotations:
    argocd.argoproj.io/sync-wave: "3"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: keycloak-public-url-templating
  annotations:
    argocd.argoproj.io/sync-wave: "3"
rules:
  - apiGroups:
      - route.openshift.io
    resources:
      - routes
    resourceNames:
      - keycloak
    verbs:
      - get
  - apiGroups:
      - route.openshift.io
    resources:
      - routes
    verbs:
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: keycloak-public-url-templating
  annotations:
    argocd.argoproj.io/sync-wave: "3"
subjects:
  - kind: ServiceAccount
    name: keycloak-public-url-templating
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: keycloak-public-url-templating
---
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: keycloak-public-url-clusters
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  clusterSets:
    - global
  # Only the hub: Keycloak and the ConfigMap's only readers run there. ACM
  # labels the hub's ManagedCluster local-cluster=true, whatever its name.
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchLabels:
            local-cluster: "true"
---
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: keycloak-public-url
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    policy.open-cluster-management.io/refresh: "rbac-2026-10-27"
spec:
  remediationAction: enforce
  disabled: false
  hubTemplateOptions:
    serviceAccountName: keycloak-public-url-templating
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: keycloak-public-url
        spec:
          remediationAction: enforce
          severity: high
          namespaceSelector:
            include:
              - maas-db
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: ConfigMap
                metadata:
                  name: keycloak-public-url
                  namespace: maas-db
                data:
                  KEYCLOAK_PUBLIC_URL: '{{hub printf "https://%s" (index (lookup "route.openshift.io/v1" "Route" "maas-db" "keycloak").status.ingress 0).host hub}}'
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: keycloak-public-url
  annotations:
    argocd.argoproj.io/sync-wave: "4"
placementRef:
  apiGroup: cluster.open-cluster-management.io
  kind: Placement
  name: keycloak-public-url-clusters
subjects:
  - apiGroup: policy.open-cluster-management.io
    kind: Policy
    name: keycloak-public-url
