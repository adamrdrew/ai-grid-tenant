    - group: maas.opendatahub.io
      kind: MaaSSubscription
      check: |
        hs = {}
        if obj.status == nil or obj.status.conditions == nil then
          hs.status = "Progressing"
          hs.message = "Waiting for MaaSSubscription status"
          return hs
        end
        local failedPhases = {
          Degraded = true,
          Failed = true,
          Invalid = true
        }
        if failedPhases[obj.status.phase] then
          hs.status = "Degraded"
          hs.message = "MaaSSubscription phase: " .. obj.status.phase
          return hs
        end
        if obj.status.phase == "Pending" then
          hs.status = "Progressing"
          hs.message = "MaaSSubscription is pending"
          return hs
        end
        for _, status in ipairs(obj.status.modelRefStatuses or {}) do
          if status.ready == false then
            hs.status = "Degraded"
            hs.message = status.message or "MaaS model reference is not ready"
            return hs
          end
        end
        for _, status in ipairs(obj.status.flowControlStatuses or {}) do
          if status.ready == false then
            hs.status = "Degraded"
            hs.message = status.message or "MaaS model flow control is not ready"
            return hs
          end
        end
        for _, status in ipairs(obj.status.tokenRateLimitStatuses or {}) do
          if status.ready == false then
            hs.status = "Degraded"
            hs.message = status.message or "MaaS token rate limit is not ready"
            return hs
          end
        end
        for _, condition in ipairs(obj.status.conditions) do
          if condition.type == "Ready" then
            if obj.metadata.generation ~= nil and condition.observedGeneration ~= nil and condition.observedGeneration < obj.metadata.generation then
              hs.status = "Progressing"
              hs.message = "Waiting for the current MaaSSubscription generation"
              return hs
            end
            if condition.status == "True" then
              hs.status = "Healthy"
              hs.message = condition.message or "MaaSSubscription is ready"
              return hs
            elseif condition.status == "False" then
              hs.status = "Degraded"
              hs.message = condition.message or "MaaSSubscription is not ready"
              return hs
            end
          end
