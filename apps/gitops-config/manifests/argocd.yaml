apiVersion: argoproj.io/v1beta1
kind: ArgoCD
metadata:
  name: openshift-gitops
  namespace: openshift-gitops
spec:
  # The controller now caches both the in-cluster destination and the
  # GitOpsCluster proxy destination; 4 GiB is not enough during startup and
  # fan-out reconciliation.
  controller:
    resources:
      requests:
        memory: 2Gi
      limits:
        memory: 8Gi
  # RedisReplication is intentionally omitted because the Redis operator does
  # not currently populate a resource status for Argo to evaluate.
  resourceHealthChecks:
    - group: postgresql.cnpg.io
      kind: Cluster
      check: |
        hs = {}
        if obj.status == nil or obj.status.phase == nil then
          hs.status = "Progressing"
          hs.message = "Waiting for CloudNativePG cluster status"
          return hs
        end
        if obj.status.phase == "Cluster in healthy state" then
          hs.status = "Healthy"
          hs.message = obj.status.phase
          return hs
        end
        local degradedPhases = {
          ["Cluster is unrecoverable and needs manual intervention"] = true,
          ["Cluster cannot proceed to reconciliation due to an unknown plugin being required"] = true,
          ["Cluster cannot proceed to reconciliation due to an error while interacting with plugins"] = true,
          ["Cluster has incomplete or invalid image catalog"] = true,
          ["Invalid cluster definition"] = true
        }
        if degradedPhases[obj.status.phase] then
          hs.status = "Degraded"
          hs.message = obj.status.phase
          if obj.status.phaseReason ~= nil then
            hs.message = hs.message .. ": " .. obj.status.phaseReason
          end
          return hs
        end
        hs.status = "Progressing"
        hs.message = obj.status.phase
        return hs
    - group: external-secrets.io
      kind: ExternalSecret
      check: |
        hs = {}
        if obj.status == nil or obj.status.conditions == nil then
          hs.status = "Progressing"
          hs.message = "Waiting for ExternalSecret status"
          return hs
        end
        for _, condition in ipairs(obj.status.conditions) do
          if condition.type == "Ready" then
            if condition.status == "True" then
              hs.status = "Healthy"
              hs.message = condition.message or "ExternalSecret synchronized"
              return hs
            elseif condition.status == "False" then
              hs.status = "Degraded"
              hs.message = condition.message or "ExternalSecret synchronization failed"
              return hs
            end
          end
        end
        hs.status = "Progressing"
        hs.message = "Waiting for the ExternalSecret Ready condition"
        return hs
    - group: operators.coreos.com
      kind: Subscription
      check: |
        hs = {}
        if obj.status == nil or obj.status.state == nil or obj.status.installedCSV == nil then
          hs.status = "Progressing"
          hs.message = "Waiting for the operator subscription to install"
          return hs
        end
        if obj.status.state == "AtLatestKnown" then
          hs.status = "Healthy"
          hs.message = "Operator subscription is at the latest known CSV"
          return hs
        end
        if obj.status.state == "Failed" then
          hs.status = "Degraded"
          hs.message = "Operator subscription failed"
          if obj.status.currentCSV ~= nil then
            hs.message = hs.message .. ": " .. obj.status.currentCSV
          end
          return hs
        end
        hs.status = "Progressing"
        hs.message = "Operator subscription state: " .. obj.status.state
        return hs
    - group: datasciencecluster.opendatahub.io
      kind: DataScienceCluster
      check: |
        hs = {}
        if obj.status == nil or obj.status.conditions == nil then
          hs.status = "Progressing"
          hs.message = "Waiting for DataScienceCluster status"
          return hs
        end
        if obj.metadata.generation ~= nil and obj.status.observedGeneration ~= nil and obj.status.observedGeneration < obj.metadata.generation then
          hs.status = "Progressing"
          hs.message = "Waiting for the current DataScienceCluster generation"
          return hs
        end
        if obj.status.errorMessage ~= nil then
          hs.status = "Degraded"
          hs.message = obj.status.errorMessage
          return hs
        end
        if obj.status.phase == "Error" then
          hs.status = "Degraded"
          hs.message = "DataScienceCluster reconciliation failed"
          return hs
        end
        if obj.status.phase == "Progressing" or obj.status.phase == "Not Ready" then
          hs.status = "Progressing"
          hs.message = "DataScienceCluster phase: " .. obj.status.phase
          return hs
        end
        for _, condition in ipairs(obj.status.conditions) do
          if condition.type == "Ready" then
            if condition.status == "True" then
              hs.status = "Healthy"
              hs.message = condition.message or "DataScienceCluster is ready"
              return hs
            elseif condition.status == "False" then
              hs.status = "Degraded"
              hs.message = condition.message or "DataScienceCluster is not ready"
              return hs
            end
          end
        end
        hs.status = "Progressing"
        hs.message = "Waiting for the DataScienceCluster Ready condition"
        return hs
    - group: grid.praxis.fast
      kind: GridNetwork
      check: |
        hs = {}
        if obj.status == nil or obj.status.phase == nil then
          hs.status = "Progressing"
          hs.message = "Waiting for GridNetwork status"
          return hs
        end
        if obj.metadata.generation ~= nil and obj.status.observedGeneration ~= nil and obj.status.observedGeneration < obj.metadata.generation then
          hs.status = "Progressing"
          hs.message = "Waiting for the current GridNetwork generation"
          return hs
        end
        if obj.status.phase == "Degraded" then
          hs.status = "Degraded"
          hs.message = "GridNetwork is degraded"
          return hs
        end
        if obj.status.phase ~= "Active" then
          hs.status = "Progressing"
          hs.message = "GridNetwork phase: " .. obj.status.phase
          return hs
        end
        local available = nil
        local progressing = false
        local degraded = false
        local message = "GridNetwork is active"
        for _, condition in ipairs(obj.status.conditions or {}) do
          if condition.type == "Degraded" and condition.status == "True" then
            degraded = true
            message = condition.message or "GridNetwork is degraded"
          elseif condition.type == "Progressing" and condition.status == "True" then
            progressing = true
            message = condition.message or "GridNetwork is progressing"
          elseif condition.type == "Available" then
            available = condition.status == "True"
            message = condition.message or message
          end
        end
        if degraded then
          hs.status = "Degraded"
          hs.message = message
          return hs
        end
        if progressing then
          hs.status = "Progressing"
          hs.message = message
          return hs
        end
        if available == false then
          hs.status = "Degraded"
          hs.message = message
          return hs
        end
        hs.status = "Healthy"
        hs.message = message
        return hs
    # GridSite is intentionally disabled: site discovery and enrollment can
    # remain Pending or Discovered independently of GitOps reconciliation.
    # - group: grid.praxis.fast
    #   kind: GridSite
    #   check: |
    #     hs = {}
    #     if obj.status == nil or obj.status.phase == nil then
    #       hs.status = "Progressing"
    #       hs.message = "Waiting for GridSite status"
    #       return hs
    #     end
    #     if obj.metadata.generation ~= nil and obj.status.observedGeneration ~= nil and obj.status.observedGeneration < obj.metadata.generation then
    #       hs.status = "Progressing"
    #       hs.message = "Waiting for the current GridSite generation"
    #       return hs
    #     end
    #     if obj.status.phase == "Unreachable" then
    #       hs.status = "Degraded"
    #       hs.message = obj.status.message or "GridSite is unreachable"
    #       return hs
    #     end
    #     if obj.status.phase == "Active" or obj.status.phase == "Left" then
    #       hs.status = "Healthy"
    #       hs.message = obj.status.message or "GridSite phase: " .. obj.status.phase
    #       return hs
    #     end
    #     hs.status = "Progressing"
    #     hs.message = obj.status.message or "GridSite phase: " .. obj.status.phase
    #     return hs
    - group: grid.praxis.fast
      kind: InferenceProvider
      check: |
        hs = {}
        if obj.status == nil or obj.status.phase == nil then
          hs.status = "Progressing"
          hs.message = "Waiting for InferenceProvider status"
          return hs
        end
        if obj.metadata.generation ~= nil and obj.status.observedGeneration ~= nil and obj.status.observedGeneration < obj.metadata.generation then
          hs.status = "Progressing"
          hs.message = "Waiting for the current InferenceProvider generation"
          return hs
        end
        if obj.status.phase == "Degraded" or obj.status.phase == "Unavailable" then
          hs.status = "Degraded"
          hs.message = obj.status.reason or obj.status.message or "InferenceProvider phase: " .. obj.status.phase
          return hs
        end
        if obj.status.phase == "Pending" then
          hs.status = "Progressing"
          hs.message = obj.status.reason or obj.status.message or "InferenceProvider is pending"
          return hs
        end
        for _, condition in ipairs(obj.status.conditions or {}) do
          if condition.type == "Ready" and condition.status == "False" then
            hs.status = "Degraded"
            hs.message = condition.message or "InferenceProvider is not ready"
            return hs
          end
          if condition.type == "Degraded" and condition.status == "True" then
            hs.status = "Degraded"
            hs.message = condition.message or "InferenceProvider is degraded"
            return hs
          end
        end
        if obj.status.phase == "Available" then
          hs.status = "Healthy"
          hs.message = obj.status.reason or obj.status.message or "InferenceProvider is available"
          return hs
        end
        hs.status = "Progressing"
        hs.message = obj.status.reason or obj.status.message or "InferenceProvider phase: " .. obj.status.phase
        return hs
    - group: operator.openshift.io
      kind: ExternalSecretsConfig
      check: |
        hs = {}
        if obj.status == nil or obj.status.conditions == nil then
          hs.status = "Progressing"
          hs.message = "Waiting for External Secrets operand status"
          return hs
        end
        local ready = false
        local degraded = false
        local message = "Waiting for External Secrets operand conditions"
        for _, condition in ipairs(obj.status.conditions) do
          if condition.type == "Ready" then
            ready = condition.status == "True"
            message = condition.message or message
          elseif condition.type == "Degraded" and condition.status == "True" then
            degraded = true
            message = condition.message or message
          end
        end
        if degraded then
          hs.status = "Degraded"
          hs.message = message
          return hs
        end
        if ready then
          hs.status = "Healthy"
          hs.message = message
          return hs
        end
        hs.status = "Progressing"
        hs.message = message
        return hs
    - group: generators.external-secrets.io
      kind: Password
      check: |
        hs = {}
        hs.status = "Healthy"
        hs.message = "Password generator resource is present"
        return hs
    - group: postgresql.cnpg.io
      kind: Database
      check: |
        hs = {}
        if obj.status == nil or obj.status.applied == nil then
          hs.status = "Progressing"
          hs.message = "Waiting for CloudNativePG database status"
          return hs
        end
        if obj.metadata.generation ~= nil and obj.status.observedGeneration ~= nil and obj.status.observedGeneration < obj.metadata.generation then
          hs.status = "Progressing"
          hs.message = "Waiting for the current CloudNativePG database generation"
          return hs
        end
        if obj.status.applied then
          hs.status = "Healthy"
          hs.message = "CloudNativePG database reconciliation applied"
          return hs
        end
        hs.status = "Degraded"
        hs.message = obj.status.message or "CloudNativePG database reconciliation failed"
        return hs
    - group: postgresql.cnpg.io
      kind: DatabaseRole
