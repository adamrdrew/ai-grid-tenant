apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  # Dedicated GitOps app for the AI Grid model ApplicationSet. It is
  # discovered automatically by the bootstrap ApplicationSet.
  name: acm-models
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/adamrdrew/ai-grid-tenant.git
    targetRevision: lab/aig1-hub-catalog
    path: apps/acm-models/hub
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
