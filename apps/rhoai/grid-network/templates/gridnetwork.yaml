{{- if .Values.enabled }}
{{- if not .Values.siteName }}
{{- fail "siteName is required: the rhoai ApplicationSet sets it per cluster" }}
{{- end }}
# Nothing generates consumerGateways, and serving data is written per entry and
# only in poll mode. swimKeySecretRef is absent on purpose: only the hub has it,
# and a declared ref it cannot resolve fails the reconcile.
apiVersion: grid.praxis.fast/v1alpha1
kind: GridNetwork
metadata:
  name: {{ .Values.networkName }}
  annotations:
    # Retain the existing identity while enrollment takes over configuration.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  signalTransport:
    mode: poll
  peerTrust:
    mode: spiffe
  tls:
    siteSecretRef:
      name: grid-site-identity
      namespace: {{ .Values.namespace }}
    caSecretRef:
      name: grid-ca
      namespace: {{ .Values.namespace }}
  consumerGateways:
    - name: {{ .Values.gatewayName }}
      namespace: {{ .Values.namespace }}
      siteName: {{ .Values.siteName }}
{{- end }}
