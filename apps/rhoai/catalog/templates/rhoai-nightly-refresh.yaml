{{- if .Values.refresh.enabled }}
{{- $catalogImage := printf "%s/%s:%s" .Values.image.registry .Values.image.repository .Values.image.tag }}
{{- $refreshKey := printf "%s/%s" .Chart.Version $catalogImage }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rhoai-nightly-refresh
  namespace: {{ .Values.refresh.subscriptionNamespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rhoai-nightly-refresh
  namespace: {{ .Values.refresh.subscriptionNamespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
rules:
  - apiGroups:
      - operators.coreos.com
    resources:
      - subscriptions
    verbs:
      - get
  - apiGroups:
      - operators.coreos.com
    resources:
      - subscriptions/status
    verbs:
      - get
      - patch
  - apiGroups:
      - operators.coreos.com
    resources:
      - clusterserviceversions
    verbs:
      - get
      - delete
  - apiGroups:
      - operators.coreos.com
    resources:
      - installplans
    verbs:
      - get
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rhoai-nightly-refresh
  namespace: {{ .Values.refresh.subscriptionNamespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rhoai-nightly-refresh
subjects:
  - kind: ServiceAccount
    name: rhoai-nightly-refresh
    namespace: {{ .Values.refresh.subscriptionNamespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rhoai-nightly-refresh
  namespace: {{ .Values.refresh.modelControllerNamespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
rules:
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - get
      - delete
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - get
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rhoai-nightly-refresh
  namespace: {{ .Values.refresh.modelControllerNamespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rhoai-nightly-refresh
subjects:
  - kind: ServiceAccount
    name: rhoai-nightly-refresh
    namespace: {{ .Values.refresh.subscriptionNamespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rhoai-nightly-refresh
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
rules:
  - apiGroups:
      - packages.operators.coreos.com
    resources:
      - packagemanifests
    verbs:
      - get
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rhoai-nightly-refresh
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: rhoai-nightly-refresh
subjects:
  - kind: ServiceAccount
    name: rhoai-nightly-refresh
    namespace: {{ .Values.refresh.subscriptionNamespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: rhoai-nightly-refresh-{{ $refreshKey | sha256sum | trunc 10 }}
  namespace: {{ .Values.refresh.subscriptionNamespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  backoffLimit: 0
  activeDeadlineSeconds: {{ .Values.refresh.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rhoai-nightly-refresh
    spec:
      serviceAccountName: rhoai-nightly-refresh
      restartPolicy: Never
      containers:
        - name: refresh
          image: {{ .Values.refresh.image }}
          command:
            - /bin/bash
            - -c
            - |
              set -Eeuo pipefail

              package="${PACKAGE}"
              channel="${CHANNEL}"
              catalog_namespace="${CATALOG_NAMESPACE}"
              subscription_namespace="${SUBSCRIPTION_NAMESPACE}"
              subscription_name="${SUBSCRIPTION_NAME}"
              catalog_settle_seconds="${CATALOG_SETTLE_SECONDS}"
              wait_timeout="${WAIT_TIMEOUT_SECONDS}"
              model_controller_namespace="${MODEL_CONTROLLER_NAMESPACE}"
              model_controller_name="${MODEL_CONTROLLER_NAME}"
              model_controller_parameters_configmap="${MODEL_CONTROLLER_PARAMETERS_CONFIGMAP}"
              model_controller_wait_timeout="${MODEL_CONTROLLER_WAIT_TIMEOUT_SECONDS}"

              sleep "${catalog_settle_seconds}"
              # A package name can occur in multiple catalogs. Select the source
              # configured on this Subscription before choosing its channel.
              catalog_record="$(oc get subscription.operators.coreos.com "${subscription_name}" -n "${subscription_namespace}" \
                -o jsonpath='{.spec.source}{"|"}{.spec.sourceNamespace}')"
              IFS='|' read -r catalog_name subscription_catalog_namespace <<< "${catalog_record}"
              if [[ -z "${catalog_name}" ]]; then
                echo "ERROR: Subscription ${subscription_name} has no catalog source" >&2
                exit 1
              fi
              catalog_namespace="${subscription_catalog_namespace:-${catalog_namespace}}"
              channel_records="$(oc get packagemanifests -n "${catalog_namespace}" \
                --field-selector "metadata.name=${package}" \
                --selector "catalog=${catalog_name},catalog-namespace=${catalog_namespace}" \
                -o jsonpath='{range .items[*].status.channels[*]}{.name}|{.currentCSV}|{.currentCSVDesc.annotations.containerImage}{"\n"}{end}')"
              channel_record="$(printf '%s\n' "${channel_records}" | awk -F '|' -v channel="${channel}" '$1 == channel { print; exit }')"
              desired_csv="$(printf '%s\n' "${channel_record}" | cut -d'|' -f2)"
              catalog_image="$(printf '%s\n' "${channel_record}" | cut -d'|' -f3)"
              if [[ -z "${desired_csv}" || -z "${catalog_image}" ]]; then
                echo "ERROR: channel ${channel} has no CSV or operator image for package ${package} in catalog ${catalog_namespace}/${catalog_name}" >&2
                exit 1
              fi

              installed_image="$(oc get csv "${desired_csv}" -n "${subscription_namespace}" \
                -o jsonpath='{.metadata.annotations.containerImage}' 2>/dev/null || true)"
              echo "Desired CSV: ${desired_csv}"
              echo "Catalog operator image: ${catalog_image}"
              echo "Installed operator image: ${installed_image:-<missing>}"

              olm_refreshed=false
              if [[ "${installed_image}" == "${catalog_image}" ]]; then
                echo "Installed operator image already matches the catalog; no OLM refresh required"
                olm_refreshed=true
              else
                old_install_plan="$(oc get subscription.operators.coreos.com "${subscription_name}" -n "${subscription_namespace}" \
                  -o jsonpath='{.status.installPlanRef.name}' 2>/dev/null || true)"

                echo "Refreshing ${subscription_namespace}/${desired_csv} through OLM"
                oc delete csv "${desired_csv}" -n "${subscription_namespace}" --ignore-not-found=true

                if [[ -n "${old_install_plan}" ]]; then
                  oc delete installplan.operators.coreos.com "${old_install_plan}" -n "${subscription_namespace}" --ignore-not-found=true
                fi

                oc patch subscription.operators.coreos.com "${subscription_name}" -n "${subscription_namespace}" \
                  --subresource=status --type=merge \
                  -p '{"status":{"state":"None","currentCSV":"","installedCSV":"","installPlanRef":null,"installplan":null}}'

                deadline=$((SECONDS + wait_timeout))
                last_log=0
                while (( SECONDS < deadline )); do
                  state="$(oc get subscription.operators.coreos.com "${subscription_name}" -n "${subscription_namespace}" \
                    -o jsonpath='{.status.state}' 2>/dev/null || true)"
                  current_csv="$(oc get subscription.operators.coreos.com "${subscription_name}" -n "${subscription_namespace}" \
                    -o jsonpath='{.status.currentCSV}' 2>/dev/null || true)"
                  current_image="$(oc get csv "${current_csv}" -n "${subscription_namespace}" \
                    -o jsonpath='{.metadata.annotations.containerImage}' 2>/dev/null || true)"

                  if [[ "${state}" == "AtLatestKnown" && "${current_csv}" == "${desired_csv}" && "${current_image}" == "${catalog_image}" ]]; then
                    echo "OLM refreshed ${desired_csv} to ${catalog_image}"
                    olm_refreshed=true
                    break
                  fi

                  if (( SECONDS - last_log >= 15 )); then
                    echo "Waiting for OLM refresh: state=${state:-<missing>} currentCSV=${current_csv:-<missing>}"
                    last_log="${SECONDS}"
                  fi
                  sleep 5
                done
              fi

              if [[ "${olm_refreshed}" != true ]]; then
                echo "ERROR: timed out after ${wait_timeout}s waiting for OLM to refresh ${desired_csv}" >&2
                exit 1
              fi

              desired_model_controller_image="$(oc get csv "${desired_csv}" -n "${subscription_namespace}" \
                -o jsonpath='{.spec.relatedImages[?(@.name=="odh_model_controller_image")].image}')"
              if [[ -z "${desired_model_controller_image}" ]]; then
                echo "ERROR: CSV ${desired_csv} has no odh_model_controller_image related image" >&2
                exit 1
              fi

              current_model_controller_image="$(oc get deployment "${model_controller_name}" -n "${model_controller_namespace}" \
                -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || true)"
              current_model_controller_parameters_image="$(oc get configmap "${model_controller_parameters_configmap}" -n "${model_controller_namespace}" \
                -o jsonpath='{.data.odh-model-controller}' 2>/dev/null || true)"
              echo "Desired model-controller image: ${desired_model_controller_image}"
              echo "Current model-controller image: ${current_model_controller_image:-<missing>}"
              echo "Current parameters image: ${current_model_controller_parameters_image:-<missing>}"

              if [[ "${current_model_controller_image}" != "${desired_model_controller_image}" || "${current_model_controller_parameters_image}" != "${desired_model_controller_image}" ]]; then
                echo "Patching ${model_controller_namespace}/${model_controller_parameters_configmap} and refreshing ${model_controller_name} Deployment"
                oc patch configmap "${model_controller_parameters_configmap}" -n "${model_controller_namespace}" \
                  --type=merge -p "{\"data\":{\"odh-model-controller\":\"${desired_model_controller_image}\"}}"
                oc delete deployment "${model_controller_name}" -n "${model_controller_namespace}" --ignore-not-found=true

                model_controller_deadline=$((SECONDS + model_controller_wait_timeout))
                model_controller_last_log=0
                while (( SECONDS < model_controller_deadline )); do
                  current_model_controller_image="$(oc get deployment "${model_controller_name}" -n "${model_controller_namespace}" \
                    -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || true)"
                  current_model_controller_parameters_image="$(oc get configmap "${model_controller_parameters_configmap}" -n "${model_controller_namespace}" \
                    -o jsonpath='{.data.odh-model-controller}' 2>/dev/null || true)"
                  model_controller_available="$(oc get deployment "${model_controller_name}" -n "${model_controller_namespace}" \
                    -o jsonpath='{.status.conditions[?(@.type=="Available")].status}' 2>/dev/null || true)"

                  if [[ "${current_model_controller_image}" == "${desired_model_controller_image}" && "${current_model_controller_parameters_image}" == "${desired_model_controller_image}" && "${model_controller_available}" == "True" ]]; then
                    echo "Model controller refreshed to ${desired_model_controller_image}"
                    exit 0
                  fi

                  if (( SECONDS - model_controller_last_log >= 15 )); then
                    echo "Waiting for model-controller refresh: image=${current_model_controller_image:-<missing>} parameters=${current_model_controller_parameters_image:-<missing>} available=${model_controller_available:-<missing>}"
                    model_controller_last_log="${SECONDS}"
                  fi
                  sleep 5
                done

                echo "ERROR: timed out after ${model_controller_wait_timeout}s waiting for model-controller refresh" >&2
                exit 1
              fi

              echo "Model-controller image already matches the CSV; no refresh required"
          env:
            - name: PACKAGE
              value: {{ .Values.refresh.package | quote }}
            - name: CHANNEL
              value: {{ .Values.refresh.channel | quote }}
            - name: CATALOG_NAMESPACE
              value: {{ .Values.refresh.catalogNamespace | quote }}
            - name: SUBSCRIPTION_NAMESPACE
              value: {{ .Values.refresh.subscriptionNamespace | quote }}
            - name: SUBSCRIPTION_NAME
              value: {{ .Values.refresh.subscriptionName | quote }}
            - name: CATALOG_SETTLE_SECONDS
              value: {{ .Values.refresh.catalogSettleSeconds | quote }}
            - name: WAIT_TIMEOUT_SECONDS
              value: {{ .Values.refresh.waitTimeoutSeconds | quote }}
            - name: MODEL_CONTROLLER_NAMESPACE
              value: {{ .Values.refresh.modelControllerNamespace | quote }}
            - name: MODEL_CONTROLLER_NAME
              value: {{ .Values.refresh.modelControllerName | quote }}
            - name: MODEL_CONTROLLER_PARAMETERS_CONFIGMAP
              value: {{ .Values.refresh.modelControllerParametersConfigMap | quote }}
            - name: MODEL_CONTROLLER_WAIT_TIMEOUT_SECONDS
              value: {{ .Values.refresh.modelControllerWaitTimeoutSeconds | quote }}
          resources:
            {{- toYaml .Values.refresh.resources | nindent 12 }}
{{- end }}
