{{- if .Values.refresh.enabled }}
{{- $catalogImage := printf "%s/%s:%s" .Values.image.registry .Values.image.repository .Values.image.tag }}
{{- $refreshKey := printf "%s/%s" .Chart.Version $catalogImage }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rhoai-nightly-refresh
  namespace: {{ .Values.refresh.subscriptionNamespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rhoai-nightly-refresh
  namespace: {{ .Values.refresh.subscriptionNamespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
rules:
  - apiGroups:
      - operators.coreos.com
    resources:
      - subscriptions
    verbs:
      - get
      - delete
  - apiGroups:
      - operators.coreos.com
    resources:
      - subscriptions/status
    verbs:
      - get
  - apiGroups:
      - operators.coreos.com
    resources:
      - clusterserviceversions
    verbs:
      - get
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rhoai-nightly-refresh
  namespace: {{ .Values.refresh.subscriptionNamespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rhoai-nightly-refresh
subjects:
  - kind: ServiceAccount
    name: rhoai-nightly-refresh
    namespace: {{ .Values.refresh.subscriptionNamespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rhoai-nightly-refresh
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
rules:
  - apiGroups:
      - packages.operators.coreos.com
    resources:
      - packagemanifests
    verbs:
      - get
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rhoai-nightly-refresh
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: rhoai-nightly-refresh
subjects:
  - kind: ServiceAccount
    name: rhoai-nightly-refresh
    namespace: {{ .Values.refresh.subscriptionNamespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: rhoai-nightly-refresh-{{ $refreshKey | sha256sum | trunc 10 }}
  namespace: {{ .Values.refresh.subscriptionNamespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  backoffLimit: 0
  activeDeadlineSeconds: {{ .Values.refresh.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rhoai-nightly-refresh
    spec:
      serviceAccountName: rhoai-nightly-refresh
      restartPolicy: Never
      containers:
        - name: refresh
          image: {{ .Values.refresh.image }}
          command:
            - /bin/bash
            - -c
            - |
              set -Eeuo pipefail

              package="${PACKAGE}"
              channel="${CHANNEL}"
              catalog_namespace="${CATALOG_NAMESPACE}"
              subscription_namespace="${SUBSCRIPTION_NAMESPACE}"
              subscription_name="${SUBSCRIPTION_NAME}"
              catalog_settle_seconds="${CATALOG_SETTLE_SECONDS}"
              wait_timeout="${WAIT_TIMEOUT_SECONDS}"
              operator_rollout_timeout="${OPERATOR_ROLLOUT_TIMEOUT_SECONDS}"

              sleep "${catalog_settle_seconds}"
              # A package name can occur in multiple catalogs. Select the source
              # configured on this Subscription before choosing its channel.
              catalog_record="$(oc get subscription.operators.coreos.com "${subscription_name}" -n "${subscription_namespace}" \
                -o jsonpath='{.spec.source}{"|"}{.spec.sourceNamespace}')"
              IFS='|' read -r catalog_name subscription_catalog_namespace <<< "${catalog_record}"
              if [[ -z "${catalog_name}" ]]; then
                echo "ERROR: Subscription ${subscription_name} has no catalog source" >&2
                exit 1
              fi
              catalog_namespace="${subscription_catalog_namespace:-${catalog_namespace}}"
              channel_records="$(oc get packagemanifests -n "${catalog_namespace}" \
                --field-selector "metadata.name=${package}" \
                --selector "catalog=${catalog_name},catalog-namespace=${catalog_namespace}" \
                -o jsonpath='{range .items[*].status.channels[*]}{.name}|{.currentCSV}|{.currentCSVDesc.annotations.containerImage}{"\n"}{end}')"
              channel_record="$(printf '%s\n' "${channel_records}" | awk -F '|' -v channel="${channel}" '$1 == channel { print; exit }')"
              desired_csv="$(printf '%s\n' "${channel_record}" | cut -d'|' -f2)"
              catalog_image="$(printf '%s\n' "${channel_record}" | cut -d'|' -f3)"
              if [[ -z "${desired_csv}" || -z "${catalog_image}" ]]; then
                echo "ERROR: channel ${channel} has no CSV or operator image for package ${package} in catalog ${catalog_namespace}/${catalog_name}" >&2
                exit 1
              fi

              installed_image="$(oc get csv "${desired_csv}" -n "${subscription_namespace}" \
                -o jsonpath='{.metadata.annotations.containerImage}' 2>/dev/null || true)"
              echo "Desired CSV: ${desired_csv}"
              echo "Catalog operator image: ${catalog_image}"
              echo "Installed operator image: ${installed_image:-<missing>}"

              olm_refreshed=false
              if [[ "${installed_image}" == "${catalog_image}" ]]; then
                echo "Installed operator image already matches the catalog; no OLM refresh required"
                olm_refreshed=true
              else
                echo "Refreshing ${subscription_namespace}/${subscription_name} by recreating the Subscription"
                oc delete subscription.operators.coreos.com "${subscription_name}" -n "${subscription_namespace}"

                deadline=$((SECONDS + wait_timeout))
                last_log=0
                while (( SECONDS < deadline )); do
                  state="$(oc get subscription.operators.coreos.com "${subscription_name}" -n "${subscription_namespace}" \
                    -o jsonpath='{.status.state}' 2>/dev/null || true)"
                  current_csv="$(oc get subscription.operators.coreos.com "${subscription_name}" -n "${subscription_namespace}" \
                    -o jsonpath='{.status.currentCSV}' 2>/dev/null || true)"
                  current_image="$(oc get csv "${current_csv}" -n "${subscription_namespace}" \
                    -o jsonpath='{.metadata.annotations.containerImage}' 2>/dev/null || true)"

                  if [[ "${state}" == "AtLatestKnown" && "${current_csv}" == "${desired_csv}" && "${current_image}" == "${catalog_image}" ]]; then
                    echo "OLM refreshed ${desired_csv} to ${catalog_image}"
                    olm_refreshed=true
                    break
                  fi

                  if (( SECONDS - last_log >= 15 )); then
                    echo "Waiting for OLM refresh: state=${state:-<missing>} currentCSV=${current_csv:-<missing>}"
                    last_log="${SECONDS}"
                  fi
                  sleep 5
                done
              fi

              if [[ "${olm_refreshed}" != true ]]; then
                echo "ERROR: timed out after ${wait_timeout}s waiting for OLM to refresh ${desired_csv}" >&2
                exit 1
              fi

              operator_deployments="$(oc get csv "${desired_csv}" -n "${subscription_namespace}" \
                -o jsonpath='{range .spec.install.spec.deployments[*]}{.name}{"\n"}{end}')"
              if [[ -z "${operator_deployments}" ]]; then
                echo "ERROR: CSV ${desired_csv} declares no operator Deployments" >&2
                exit 1
              fi

              operator_rollout_deadline=$((SECONDS + operator_rollout_timeout))
              operator_rollout_last_log=0
              operator_rollout_complete=false
              while (( SECONDS < operator_rollout_deadline )); do
                operator_rollout_complete=true
                while IFS= read -r operator_deployment; do
                  [[ -n "${operator_deployment}" ]] || continue
                  generation="$(oc get deployment "${operator_deployment}" -n "${subscription_namespace}" \
                    -o jsonpath='{.metadata.generation}' 2>/dev/null || true)"
                  observed_generation="$(oc get deployment "${operator_deployment}" -n "${subscription_namespace}" \
                    -o jsonpath='{.status.observedGeneration}' 2>/dev/null || true)"
                  available="$(oc get deployment "${operator_deployment}" -n "${subscription_namespace}" \
                    -o jsonpath='{.status.conditions[?(@.type=="Available")].status}' 2>/dev/null || true)"

                  if [[ "${generation}" != "${observed_generation}" || "${available}" != "True" ]]; then
                    operator_rollout_complete=false
                  fi
                done <<< "${operator_deployments}"

                if [[ "${operator_rollout_complete}" == true ]]; then
                  echo "Operator Deployments from ${desired_csv} are available"
                  break
                fi

                if (( SECONDS - operator_rollout_last_log >= 15 )); then
                  echo "Waiting for operator Deployments from ${desired_csv} to roll out"
                  operator_rollout_last_log="${SECONDS}"
                fi
                sleep 5
              done

              if [[ "${operator_rollout_complete}" != true ]]; then
                echo "ERROR: timed out after ${operator_rollout_timeout}s waiting for operator Deployments from ${desired_csv}" >&2
                exit 1
              fi
          env:
            - name: PACKAGE
              value: {{ .Values.refresh.package | quote }}
            - name: CHANNEL
              value: {{ .Values.refresh.channel | quote }}
            - name: CATALOG_NAMESPACE
              value: {{ .Values.refresh.catalogNamespace | quote }}
            - name: SUBSCRIPTION_NAMESPACE
              value: {{ .Values.refresh.subscriptionNamespace | quote }}
            - name: SUBSCRIPTION_NAME
              value: {{ .Values.refresh.subscriptionName | quote }}
            - name: CATALOG_SETTLE_SECONDS
              value: {{ .Values.refresh.catalogSettleSeconds | quote }}
            - name: WAIT_TIMEOUT_SECONDS
              value: {{ .Values.refresh.waitTimeoutSeconds | quote }}
            - name: OPERATOR_ROLLOUT_TIMEOUT_SECONDS
              value: {{ .Values.refresh.operatorRolloutTimeoutSeconds | quote }}
          resources:
            {{- toYaml .Values.refresh.resources | nindent 12 }}
{{- end }}
