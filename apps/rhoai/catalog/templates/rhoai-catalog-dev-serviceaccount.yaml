apiVersion: v1
kind: ServiceAccount
metadata:
  name: rhoai-catalog-dev
  namespace: openshift-marketplace
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
# OLM creates this ServiceAccount only when it is absent and does not update
# an existing one after CatalogSource.spec.secrets changes. Managing it here
# makes the pull-secret wiring converge on both new and existing clusters.
imagePullSecrets:
  - name: rhoai-catalog-pull-secret
