# Nightly RHOAI catalog (FBC fragment); image managed in apps/rhoai/nightly.yaml.
# Requires the quay.io/rhoai prerequisites distributed by
# apps/rhoai-prerequisites.
apiVersion: operators.coreos.com/v1alpha1
kind: CatalogSource
metadata:
  name: rhoai-catalog-dev
  namespace: openshift-marketplace
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  displayName: Red Hat OpenShift AI (nightly)
  publisher: RHOAI Development Catalog
  image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}"
  secrets:
    - rhoai-catalog-pull-secret
  sourceType: grpc
