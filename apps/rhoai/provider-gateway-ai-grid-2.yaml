# Peers dial this directly, so the SNI stays <site>.grid.internal and matches the leaf.
fullnameOverride: grid-provider-gateway
# A standalone release does not inherit the umbrella's pin. Keep this Grid
# v0.3.0-rc.2 digest aligned with the shared gateway image in values.yaml.
image:
  flavor: grid-gateway
  repository: registry.redhat.io/rhoai/odh-praxis-ai-grid-gateway-rhel9
  digest: sha256:cdd26e50ec289a71ea4f870f8c5097908b88d78de5882defd886683e846b35c0
grid:
  networkName: grid
praxisConfig:
  source: render
  render:
    role: provider
    peerTrust:
      mode: spiffe
      spiffeIds:
        - spiffe://grid.internal/site/local-cluster
    backends:
      - cluster: local-model
        endpoints:
          - facebook-opt-125m-kserve-workload-svc.ai-grid-internal-models.svc.cluster.local.:8000
        transport:
          mode: tls
          ca:
            configMapName: openshift-service-ca.crt
            key: service-ca.crt
        # praxis refuses a name that resolves to a private address.
        trustPrivate: true
gridIdentity:
  tlsSecretName: grid-site-identity
  caSecretName: grid-ca
  mountPath: /etc/praxis/tls
# Peers arrive through the router, so the Service needs no address of its own.
service:
  type: ClusterIP
# The router already carries 443 on both clusters, so peers arrive there. The
# Route's host is the name on this site's leaf, which is also the SNI a peer
# sends, so passthrough reaches the listener with the client certificate intact.
route:
  enabled: true
  host: ai-grid-2.grid.internal
  tls:
    termination: passthrough
  annotations:
    haproxy.router.openshift.io/timeout: 300s
networkPolicy:
  # A peer arrives through the load balancer, and externalTrafficPolicy Cluster
  # translates it to the address of the node that received it. The peer itself is
  # authenticated by its certificate and SPIFFE id on the listener, not here.
  from:
    - podSelector:
        matchLabels:
          grid.opendatahub.io/gateway-client: "true"
    - namespaceSelector:
        matchLabels:
          network.openshift.io/policy-group: ingress
    - ipBlock:
        cidr: 10.0.0.0/16
