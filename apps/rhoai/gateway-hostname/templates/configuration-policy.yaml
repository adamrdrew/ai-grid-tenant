{{- $gateway := .Values.components.aigateway.modelsAsAService.gateway }}
{{- /* Route mode: the Route's host is the external name, and a listener hostname breaks its SNI. */}}
{{- $routeMode := (($gateway.openshiftRoute | default dict).enabled | default false) }}
{{- if ne (.Values.role | default "") "inference" }}
{{- $hostnamePrefix := index $gateway.annotations "ai-grid/maas-gateway-hostname-prefix" }}
{{- if not $hostnamePrefix }}{{ fail "components.aigateway.modelsAsAService.gateway.annotations.ai-grid/maas-gateway-hostname-prefix is required" }}{{ end }}
apiVersion: policy.open-cluster-management.io/v1
kind: ConfigurationPolicy
metadata:
  name: rhoai-maas-gateway-hostname
  namespace: {{ required "clusterNamespace is required" .Values.clusterNamespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  remediationAction: enforce
  severity: high
  object-templates:
    - complianceType: musthave
      objectDefinition:
        {{- if $routeMode }}
        apiVersion: route.openshift.io/v1
        kind: Route
        metadata:
          name: {{ $gateway.openshiftRoute.name | default "maas-gateway-route" }}
          namespace: {{ $gateway.namespace }}
        spec:
          host: '{{ $hostnamePrefix }}.{{ "{{" }} (lookup "config.openshift.io/v1" "Ingress" "" "cluster").spec.domain {{ "}}" }}'
    # A previous load balancer configuration may have set listener hostnames.
    # The re-encrypt Route presents the Service name as SNI, so clear them.
    - complianceType: musthave
      objectDefinition:
        apiVersion: gateway.networking.k8s.io/v1
        kind: Gateway
        metadata:
          name: {{ $gateway.name }}
          namespace: {{ $gateway.namespace }}
        spec:
          listeners:
            - name: http
              hostname: null
            - name: https
              hostname: null
        {{- else }}
        apiVersion: gateway.networking.k8s.io/v1
        kind: Gateway
        metadata:
          name: {{ $gateway.name }}
          namespace: {{ $gateway.namespace }}
        spec:
          listeners:
            - name: http
              hostname: '{{ $hostnamePrefix }}.{{ "{{" }} (lookup "config.openshift.io/v1" "Ingress" "" "cluster").spec.domain {{ "}}" }}'
            - name: https
              hostname: '{{ $hostnamePrefix }}.{{ "{{" }} (lookup "config.openshift.io/v1" "Ingress" "" "cluster").spec.domain {{ "}}" }}'
        {{- end }}
{{- end }}
