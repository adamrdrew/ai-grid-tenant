skipCrdCheck: true
profile: maas
operator:
  type: rhoai
  rhoai:
    olm:
      # Nightly catalog (image ref managed in apps/rhoai/nightly.yaml);
      # requires prerequisites distributed by apps/rhoai-prerequisites.
      source: rhoai-catalog-dev
      channel: stable-3.6
      # ACM owns this Red Hat managed Namespace; OSD rejects Argo writes to it.
      createNamespace: false
      config:
        env:
          # Validation build from praxis-proxy/grid commit 3a5fa6f74943fcb0175263bae1be455e7b355ad8.
          - name: RELATED_IMAGE_ODH_PRAXIS_AI_GRID_OPERATOR_IMAGE
            value: quay.io/sbatsche/grid-operator@sha256:46aed6e0be3e925dc0c2c007e62be93afbd6775fa7b6865b1a712d81a19eaffd
# Workaround for https://redhat.atlassian.net/browse/RHOAIENG-99507:
# RHACM's multicluster-observability-addon also installs COO with its own
# OperatorGroup (named after the namespace), which conflicts with the chart's
# (named after the package) and blocks CSV installs/upgrades. Let RHACM own
# COO on this cluster until the OG naming is standardized in odh-gitops.
dependencies:
  rhcl:
    olm:
      config:
        env:
          - name: AUTH_SERVICE_TIMEOUT
            value: 1s
    config:
      authorinoServiceCaTrust: true
  clusterObservability:
    enabled: false
  loki:
    olm:
      # The platform owns this Red Hat managed Namespace.
      createNamespace: false
services:
  monitoring:
    dsci:
      managementState: Managed
      # Minimal dev config: metrics need storage size; traces require a
      # storage backend (pv = ephemeral-ish local dev storage, no S3 needed).
      metrics:
        storage:
          size: 20Gi
        exporters:
          prometheus/rhacm:
            endpoint: 0.0.0.0:8890
      traces:
        storage:
          backend: pv
          size: 10Gi
components:
  dashboard:
    dsc:
      managementState: Managed
      # TODO: Enable consumer portal once this is in: https://github.com/opendatahub-io/odh-gitops/pull/203
      # maasConsumerPortal:
      #  managementState: Managed
  kserve:
    gateway:
      annotations:
        grid.opendatahub.io/serving: >-
          {
            "networkName": "grid",
            "namespace": "redhat-ai-grid",
            "serviceAccount": "grid-model-client",
            "tokenSecret": "grid-model-client-token",
            "publishMetrics": true
          }
      spec:
        listeners:
          - name: http
            port: 80
            # hostname: <HOSTNAME> # Uncomment this line to use a specific hostname.
            protocol: HTTP
            allowedRoutes:
              namespaces:
                # The following is an example of how to restrict the namespaces to the interested ones.
                from: Selector
                selector:
                  matchExpressions:
                    - key: kubernetes.io/metadata.name
                      operator: In
                      values:
                        - openshift-ingress
                        - ai-grid-internal-models

          - name: https
            port: 443
            # hostname: <HOSTNAME> # Uncomment this line to use a specific hostname.
            protocol: HTTPS
            allowedRoutes:
              namespaces:
                # The following is an example of how to restrict the namespaces to the interested ones.
                from: Selector
                selector:
                  matchExpressions:
                    - key: kubernetes.io/metadata.name
                      operator: In
                      values:
                        - openshift-ingress
                        - ai-grid-internal-models
  aigateway:
    dsc:
      aiGrid:
        managementState: Managed
    modelsAsAService:
      gateway:
        spec:
          listeners:
            - name: http
              port: 80
              # hostname: <HOSTNAME> # Uncomment this line to use a specific hostname.
              protocol: HTTP
              allowedRoutes:
                namespaces:
                  # The following is an example of how to restrict the namespaces to the interested ones.
                  from: Selector
                  selector:
                    matchExpressions:
                      - key: kubernetes.io/metadata.name
                        operator: In
                        values:
                          - openshift-ingress
                          # MaaS models in a Grid are represented by ExternalModel resources pointing to the Grid GW.
                          - models-as-a-service
                          - redhat-ai-gateway-infra

            - name: https
              port: 443
              # hostname: <HOSTNAME> # Uncomment this line to use a specific hostname.
              protocol: HTTPS
              allowedRoutes:
                namespaces:
                  # The following is an example of how to restrict the namespaces to the interested ones.
                  from: Selector
                  selector:
                    matchExpressions:
                      - key: kubernetes.io/metadata.name
                        operator: In
                        values:
                          - openshift-ingress
                          # MaaS models in a Grid are represented by ExternalModel resources pointing to the Grid GW.
                          - models-as-a-service
                          - redhat-ai-gateway-infra

# Grid v0.3.0-rc.1 runtimes from the RHDS build at 992b076.
# The subcharts otherwise fall back to ghcr.io/praxis-proxy. Keep these pins
# aligned with the Grid operator payload when updating the catalog:
#   oc -n redhat-ods-operator get deploy rhods-operator -o json | jq -r '
#     .spec.template.spec.containers[].env[] | select(.name|test("PRAXIS_AI_GRID"))'
global:
  relatedImages:
    - name: RELATED_IMAGE_ODH_PRAXIS_AI_GRID_GATEWAY_IMAGE
      value: registry.redhat.io/rhoai/odh-praxis-ai-grid-gateway-rhel9@sha256:17b43cd1aeeb879c20c069774391eecd09f48d8920b2262000726ff401a7f54b
    - name: RELATED_IMAGE_ODH_PRAXIS_AI_GRID_ENROLLMENT_IMAGE
      value: registry.redhat.io/rhoai/odh-praxis-ai-grid-enrollment-rhel9@sha256:6dcbefe9f5496b014d4d588ec2bc3e295f6fbd3e1c5f2418145672476731b905
    # The bundle publishes this one as RELATED_IMAGE_POSTGRESQL_16_IMAGE.
    - name: RELATED_IMAGE_ODH_PRAXIS_AI_GRID_POSTGRES_IMAGE
      value: registry.redhat.io/rhel9/postgresql-16@sha256:435ba5c1d3f686cf8a45ae525b4d169ced6b33753bcfab99a1498bd9e6e99817

# Vendored by odh-gitops, so values rather than a second Application. Renders
# into redhat-ai-grid, which is the platform install's grid namespace.
grid-enrollment:
  # enabled is set per cluster by the ApplicationSet: the hub runs enrollment,
  # spokes must not hold the Grid CA signing key.
  # A Route, not the clusterset name: ACM's Submariner addon refuses to prepare a
  # ROSA cluster ("unsupported vendor OpenShiftDedicated"), so no cross-cluster
  # tunnel forms and clusterset.local does not resolve on a spoke. Passthrough is
  # the chart default, so the site still pins the grid CA end to end.
  host: grid-enrollment.apps.ai-grid-1.qhdb.p1.openshiftapps.com
  route:
    enabled: true
  serving:
    extraDnsNames:
      - grid-enrollment.redhat-ai-grid.svc.clusterset.local
  enrollment:
    # Named explicitly: the chart would derive redhat-ai-grid-invites, which
    # matches ^redhat-.* and ROSA refuses to let Argo create it. Naming it means
    # the chart does not create it either, so it comes from manifests/.
    inviteSecrets:
      namespace: grid-enrollment-invites
    authz: kube
    service:
      type: ClusterIP
  db:
    type: builtin
    builtin:
      pvcAnnotations:
        argocd.argoproj.io/sync-options: Prune=false,Delete=false
  # No invites: the ca-bootstrap and invite-admission templates both emit the
  # same ValidatingAdmissionPolicy once invites is set, and Argo refuses a
  # duplicated resource. A spoke has no enrollment configuration to redeem an
  # invite with anyway.
  hubSite:
    name: local-cluster
    namespace: redhat-ai-grid
    identitySecretName: grid-site-identity
    caSecretName: grid-ca
    swimKeySecretName: grid-swim-key
    seedSecretName: grid-reserved-seeds

# Nothing here declares a GridNetwork or GridSite: the operator creates its own
# records from its identity. flavor is explicit because the chart only infers
# grid-gateway from a repository name ending in /grid-gateway, which the RHOAI
# image does not.
praxis-gateway:
  enabled: true
  image:
    flavor: grid-gateway
  grid:
    networkName: grid
    siteName: local-cluster
  praxisConfig:
    source: render
    render:
      # MaaS authenticates the caller.
      auth:
        mode: none
      # backends is per cluster, in values-<cluster>.yaml: the name the serving
      # config uses hashes the local source UID. A cluster with no file of its
      # own fails the render rather than inheriting another cluster's name.
      # Renders grid_site_route over the operator's serving data.
      gridServing:
        enabled: true
        networkName: grid
        # Explicit: the default follows fullnameOverride.
        gatewayRefName: grid-gateway
  gridIdentity:
    tlsSecretName: grid-site-identity
    caSecretName: grid-ca
    mountPath: /etc/praxis/tls
  listenerTls:
    secretName: grid-gateway-listener-tls
  port:
    containerPort: 8443
  service:
    enabled: true
    type: ClusterIP
    # What inference.opendatahub.io/port already names.
    port: 443
    annotations:
      service.beta.openshift.io/serving-cert-secret-name: grid-gateway-listener-tls
