apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  # Generates one Application for every cluster secret created by the shared
  # GitOpsCluster integration, including local-cluster.
  name: rhoai
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            apps.open-cluster-management.io/acm-cluster: "true"
  template:
    metadata:
      name: 'rhoai-{{ .name | trunc 34 }}-{{ sha256sum .name | trunc 8 }}'
      namespace: openshift-gitops
    spec:
      project: default
      sources:
        - repoURL: https://github.com/kahowell/ai-grid-tenant.git
          targetRevision: HEAD
          ref: values
        # Pinned to a feature branch carrying operator.olm.createNamespace until
        # the change is available upstream. This lets ACM own protected
        # Namespaces while the chart still owns the OLM operator resources.
        - repoURL: https://github.com/opendatahub-io/odh-gitops.git
          targetRevision: feature-ai-grid
          path: charts/rhai-on-openshift-chart
          helm:
            releaseName: rhai-on-openshift
            # Every cluster carries its own backend, keyed by cluster name.
            ignoreMissingValueFiles: true
            valueFiles:
              - $values/apps/rhoai/values.yaml
              - $values/apps/rhoai/values-{{ .name }}.yaml
            parameters:
              - name: components.kserve.gateway.spec.listeners[1].hostname
                value: '{{ printf "llm.%s" (trimPrefix "api." (trimSuffix ":6443" (trimPrefix "https://" .server))) }}'
                forceString: true
              - name: components.aigateway.modelsAsAService.gateway.spec.listeners[1].hostname
                value: '{{ printf "maas.%s" (trimPrefix "api." (trimSuffix ":6443" (trimPrefix "https://" .server))) }}'
                forceString: true
              - name: grid-enrollment.enabled
                value: '{{ eq .name "local-cluster" | toString }}'
              - name: praxis-gateway.grid.siteName
                value: '{{ .name }}'
              # OSD ships these namespaces; a self-managed spoke has no creator.
              - name: operator.rhoai.olm.createNamespace
                value: '{{ ne .name "local-cluster" | toString }}'
              - name: dependencies.loki.olm.createNamespace
                value: '{{ ne .name "local-cluster" | toString }}'
        - repoURL: https://github.com/kahowell/ai-grid-tenant.git
          targetRevision: HEAD
          path: apps/rhoai/gateway-certs
          helm:
            releaseName: rhoai-gateway-certs
            parameters:
              - name: baseDomain
                value: '{{ trimPrefix "api." (trimSuffix ":6443" (trimPrefix "https://" .server)) }}'
                forceString: true
        - repoURL: https://github.com/kahowell/ai-grid-tenant.git
          targetRevision: HEAD
          path: apps/rhoai/manifests
        # The enrollment service runs on the hub, so a managed cluster excludes these.
        - repoURL: https://github.com/kahowell/ai-grid-tenant.git
          targetRevision: HEAD
          path: apps/rhoai/local-cluster
          directory:
            exclude: '{{ if eq .name "local-cluster" }}{{ else }}*{{ end }}'
        # The hub collects through ai-grid-o11y; a managed cluster's collector needs its own copies.
        - repoURL: https://github.com/kahowell/ai-grid-tenant.git
          targetRevision: HEAD
          path: apps/ai-grid-o11y/spoke
          directory:
            exclude: '{{ if eq .name "local-cluster" }}*{{ end }}'
        - repoURL: https://github.com/kahowell/ai-grid-tenant.git
          targetRevision: HEAD
          path: apps/rhoai/grid-network
          helm:
            releaseName: grid-network
            # A site may declare the record only once it holds the enrolled
            # identity, so the file turning it on is the record of that.
            ignoreMissingValueFiles: true
            valueFiles:
              - $values/apps/rhoai/grid-network-{{ .name }}.yaml
            parameters:
              - name: siteName
                value: '{{ .name }}'
        # The file is required: the chart has no enable switch.
        - repoURL: https://github.com/opendatahub-io/odh-gitops.git
          targetRevision: feature-ai-grid
          path: charts/rhai-on-openshift-chart/charts/praxis-gateway
          helm:
            releaseName: grid-provider-gateway
            valueFiles:
              - $values/apps/rhoai/provider-gateway-{{ .name }}.yaml
            parameters:
              - name: grid.siteName
                value: '{{ .name }}'
        - repoURL: https://github.com/kahowell/ai-grid-tenant.git
          targetRevision: HEAD
          path: apps/rhoai/catalog
          helm:
            releaseName: rhoai-nightly-catalog
            valueFiles:
              - $values/apps/rhoai/nightly.yaml
      # The hub resolves to Argo's own in-cluster destination. Routing it back
      # through the cluster-proxy applies as the ACM addon ServiceAccount, which
      # the managed-cluster webhooks deny on redhat-* namespaces and on every
      # NetworkPolicy. Argo's controller ServiceAccount is allowed both.
      destination:
        server: '{{ if eq .name "local-cluster" }}https://kubernetes.default.svc{{ else }}{{ .server }}{{ end }}'
        namespace: redhat-ai-grid
      ignoreDifferences:
        # OpenShift injects a generated dockercfg pull secret into this
        # OLM-owned ServiceAccount. Ignore only that controller-generated entry
        # so Argo still owns the explicit catalog pull secret.
        - group: ""
          kind: ServiceAccount
          name: rhoai-catalog-dev
          namespace: openshift-marketplace
          jqPathExpressions:
            - '.imagePullSecrets[] | select(.name | startswith("rhoai-catalog-dev-dockercfg-"))'
        - group: ""
          kind: Secret
          name: grid-model-client-token
          namespace: redhat-ai-grid
          jsonPointers:
            - /data
            - /metadata/annotations
        - group: ""
          kind: Service
          name: grid-provider-gateway
          namespace: redhat-ai-grid
          jsonPointers:
            - /spec/type
          jqPathExpressions:
            - '.metadata.annotations["service.beta.kubernetes.io/aws-load-balancer-internal"]'
            - '.metadata.annotations["service.beta.kubernetes.io/aws-load-balancer-type"]'
            - '.spec.ports[] | select(.name == "http") | .nodePort'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          refresh: true
          limit: 20
          backoff:
            duration: 30s
            factor: 2
            maxDuration: 30m
        syncOptions:
          # Protected Namespaces are owned by ACM or the platform, and the
          # chart omits them through createNamespace=false.
          - CreateNamespace=false
          - SkipDryRunOnMissingResource=true
          - RespectIgnoreDifferences=true
