clusterNamespace: ""
issuerName: rhoai-gateway-letsencrypt
acmeServer: https://acme-v02.api.letsencrypt.org/directory
certificates:
  - name: kserve-gateway
    secretName: kserve-gateway-tls
    hostnamePrefix: llm
    gatewayName: openshift-ai-inference
  - name: maas-gateway
    secretName: maas-gateway-tls
    hostnamePrefix: maas
    gatewayName: maas-default-gateway
