apiVersion: policy.open-cluster-management.io/v1
kind: ConfigurationPolicy
metadata:
  name: rhoai-gateway-certs
  namespace: {{ required "clusterNamespace is required" .Values.clusterNamespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  remediationAction: enforce
  severity: high
  object-templates:
    - complianceType: musthave
      objectDefinition:
        apiVersion: cert-manager.io/v1
        kind: ClusterIssuer
        metadata:
          name: {{ .Values.issuerName }}
        spec:
          acme:
            server: {{ .Values.acmeServer | quote }}
            privateKeySecretRef:
              name: rhoai-gateway-letsencrypt-account
            solvers:
              - http01:
                  gatewayHTTPRoute:
                    serviceType: ClusterIP
                    parentRefs:
{{- range .Values.certificates }}
                      - group: gateway.networking.k8s.io
                        kind: Gateway
                        name: {{ .gatewayName }}
                        namespace: openshift-ingress
                        port: 80
                        sectionName: http
{{- end }}
{{- range .Values.certificates }}
    - complianceType: musthave
      objectDefinition:
        apiVersion: cert-manager.io/v1
        kind: Certificate
        metadata:
          name: {{ .name }}
          namespace: openshift-ingress
        spec:
          secretName: {{ .secretName }}
          dnsNames:
            - '{{ .hostnamePrefix }}.{{ "{{" }} (lookup "config.openshift.io/v1" "DNS" "" "cluster").spec.baseDomain {{ "}}" }}'
          duration: 2160h
          renewBefore: 720h
          issuerRef:
            name: {{ $.Values.issuerName }}
            kind: ClusterIssuer
{{- end }}
