apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  # Dedicated GitOps app for the RHOAI ApplicationSet. It is discovered
  # automatically by the bootstrap ApplicationSet.
  name: rhoai
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/adamrdrew/ai-grid-tenant.git
    targetRevision: lab/aig1-hub-catalog
    path: apps/rhoai/hub
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      refresh: true
      limit: 20
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 30m
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
