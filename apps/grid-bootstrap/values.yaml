mode: external
fullnameOverride: grid-bootstrap
# The payload's enrollment image, matching apps/rhoai/values.yaml.
image:
  repository: registry.redhat.io/rhoai/odh-praxis-ai-grid-enrollment-rhel9
  digest: sha256:6b93a91215fb5edb968712f56347c76e48ca39a8a5e8366074392d9f061807f6
gridIdentity:
  enabled: true
ca:
  bootstrap:
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
grid:
  membership:
    source: Local
managedClusters:
  enabled: true
  networkName: grid
  clusterSet: global
  clusterLabel: ai-grid/enabled
  clusterLabelValue: 'true'
  # The rhoai hub manifests own the shared binding.
  createClusterSetBinding: false
  hubClusterName: local-cluster
external:
  delivery:
    namespace: redhat-ai-grid
  certManager:
    enabled: true
    issuer:
      create: true
      name: grid-ca
    ca:
      # This new grid generates its own CA on first bootstrap.
      mode: Generate
      secretName: grid-ca-key
