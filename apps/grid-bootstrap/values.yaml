mode: external
fullnameOverride: grid-bootstrap
# Validation build from praxis-proxy/grid commit 3a5fa6f74943fcb0175263bae1be455e7b355ad8.
image:
  repository: quay.io/sbatsche/grid-enrollment
  digest: sha256:0b392b1ade38419383a666a4c7d91cfed661f0498b670c8323f9c2650e98f258
gridIdentity:
  enabled: true
grid:
  membership:
    source: Local
managedClusters:
  enabled: true
  networkName: grid
  clusterSet: global
  clusterLabel: ai-grid/enabled
  clusterLabelValue: 'true'
  # The rhoai hub manifests own the shared binding.
  createClusterSetBinding: false
  hubClusterName: local-cluster
external:
  delivery:
    namespace: redhat-ai-grid
  certManager:
    enabled: true
    issuer:
      create: true
      name: grid-ca
    ca:
      # Preserve the existing CA while external issuance takes over identities.
      mode: Existing
      secretName: grid-ca-key
