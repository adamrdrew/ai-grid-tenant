mode: external
fullnameOverride: grid-bootstrap
# Grid v0.3.0-rc.2 enrollment from the RHDS build at bca253e, matching apps/rhoai/values.yaml.
image:
  repository: registry.redhat.io/rhoai/odh-praxis-ai-grid-enrollment-rhel9
  digest: sha256:a31c0fb11b74bc2ef13530b7f24a87b54c4ff4c476cb5b2d2c837093eabd61da
gridIdentity:
  enabled: true
grid:
  membership:
    source: Local
managedClusters:
  enabled: true
  networkName: grid
  clusterSet: global
  clusterLabel: ai-grid/enabled
  clusterLabelValue: 'true'
  # The rhoai hub manifests own the shared binding.
  createClusterSetBinding: false
  hubClusterName: local-cluster
external:
  delivery:
    namespace: redhat-ai-grid
  certManager:
    enabled: true
    issuer:
      create: true
      name: grid-ca
    ca:
      # Create a new CA for this isolated lab grid.
      mode: Generate
      secretName: grid-ca-key
