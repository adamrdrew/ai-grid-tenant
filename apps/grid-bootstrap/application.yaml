apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grid-bootstrap
  namespace: openshift-gitops
spec:
  project: default
  sources:
    - repoURL: https://github.com/adamrdrew/ai-grid-tenant.git
      targetRevision: lab/aig1-hub-catalog
      ref: values
    - repoURL: https://github.com/opendatahub-io/odh-gitops.git
      targetRevision: feature-ai-grid
      path: charts/rhai-on-openshift-chart/charts/grid-enrollment
      helm:
        releaseName: grid-bootstrap
        valueFiles:
          - $values/apps/grid-bootstrap/values.yaml
    - repoURL: https://github.com/kahowell/ai-grid-tenant.git
      targetRevision: HEAD
      path: apps/grid-bootstrap/policies
  destination:
    server: https://kubernetes.default.svc
    namespace: redhat-ai-grid
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      refresh: true
      limit: 20
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
    syncOptions:
      - CreateNamespace=false
