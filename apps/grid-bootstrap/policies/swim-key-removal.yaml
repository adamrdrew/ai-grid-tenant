# Temporary: deletes the SWIM key copies the removed grid-swim-key policy left on members.
# Local membership reads no SWIM key. Remove this file once it reports Compliant.
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: grid-swim-key-removal
  namespace: redhat-ai-grid
spec:
  clusterSets:
    - global
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchExpressions:
            # The hub's own key is the source, not a delivered copy.
            - {key: local-cluster, operator: DoesNotExist}
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: grid-swim-key-removal
  namespace: redhat-ai-grid
placementRef:
  apiGroup: cluster.open-cluster-management.io
  kind: Placement
  name: grid-swim-key-removal
subjects:
  - apiGroup: policy.open-cluster-management.io
    kind: Policy
    name: grid-swim-key-removal
---
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: grid-swim-key-removal
  namespace: redhat-ai-grid
spec:
  disabled: false
  remediationAction: enforce
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: grid-swim-key-removal
        spec:
          remediationAction: enforce
          severity: medium
          evaluationInterval:
            compliant: watch
            noncompliant: watch
          object-templates:
            - complianceType: mustnothave
              objectDefinition:
                apiVersion: v1
                kind: Secret
                metadata:
                  name: grid-swim-key
                  namespace: redhat-ai-grid
