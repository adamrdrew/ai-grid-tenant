apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: grid-local-endpoints
  namespace: redhat-ai-grid
placementRef:
  apiGroup: cluster.open-cluster-management.io
  kind: Placement
  name: grid-bootstrap-membership
subjects:
  - apiGroup: policy.open-cluster-management.io
    kind: Policy
    name: grid-local-endpoints
---
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: grid-local-endpoints
  namespace: redhat-ai-grid
spec:
  disabled: false
  remediationAction: enforce
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: grid-signals-route
        spec:
          remediationAction: enforce
          severity: high
          pruneObjectBehavior: DeleteIfCreated
          evaluationInterval:
            compliant: watch
            noncompliant: watch
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: route.openshift.io/v1
                kind: Route
                metadata:
                  name: grid-operator-signals
                  namespace: redhat-ai-grid
                spec:
                  host: '{{hub printf "%s-signals.grid.internal" .ManagedClusterName hub}}'
                  to:
                    kind: Service
                    name: grid-operator-signals
                  port:
                    targetPort: signals
                  tls:
                    termination: passthrough
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: grid-local-site
        spec:
          remediationAction: enforce
          severity: high
          # Membership withdrawal removes remote copies, retaining the source.
          pruneObjectBehavior: None
          evaluationInterval:
            compliant: watch
            noncompliant: watch
          object-templates-raw: |
            {{ $site := {{hub printf "%q" .ManagedClusterName hub}} }}
            {{ $namespace := "redhat-ai-grid" }}
            {{ range $name := (list "gridnetworks.grid.praxis.fast" "gridsites.grid.praxis.fast") }}
            {{ $crd := lookup "apiextensions.k8s.io/v1" "CustomResourceDefinition" "" $name }}
            {{ $ready := false }}
            {{ range $condition := $crd.status.conditions }}
            {{ if and (eq $condition.type "Established") (eq $condition.status "True") }}{{ $ready = true }}{{ end }}
            {{ end }}
            {{ if not $ready }}{{ fail (printf "waiting for CRD %s to be Established" $name) }}{{ end }}
            {{ end }}
            {{ $network := lookup "grid.praxis.fast/v1alpha1" "GridNetwork" "" "grid" }}
            {{ if or (not $network.spec.gridId) (ne $network.spec.membership.mode "Local") }}
            {{ fail "waiting for enrollment to configure Local membership" }}{{ end }}
            {{ $gateway := lookup "route.openshift.io/v1" "Route" $namespace "grid-provider-gateway" }}
            {{ $signals := lookup "route.openshift.io/v1" "Route" $namespace "grid-operator-signals" }}
            {{ $gatewayHost := "" }}
            {{ $signalsHost := "" }}
            {{ range $ingress := $gateway.status.ingress }}
            {{ range $condition := $ingress.conditions }}
            {{ if and (eq $condition.type "Admitted") (eq $condition.status "True") }}
            {{ $gatewayHost = $ingress.routerCanonicalHostname }}{{ end }}
            {{ end }}
            {{ end }}
            {{ range $ingress := $signals.status.ingress }}
            {{ range $condition := $ingress.conditions }}
            {{ if and (eq $condition.type "Admitted") (eq $condition.status "True") }}
            {{ $signalsHost = $ingress.routerCanonicalHostname }}{{ end }}
            {{ end }}
            {{ end }}
            {{ if or (not $gatewayHost) (not $signalsHost) }}
            {{ fail "waiting for admitted gateway and signals Routes" }}{{ end }}
            - complianceType: musthave
              objectDefinition:
                apiVersion: grid.praxis.fast/v1alpha1
                kind: GridSite
                metadata:
                  name: {{ printf "%q" $site }}
                spec:
                  gridNetworkRef: grid
                  gatewayEndpoint:
                    address: {{ printf "%q" (printf "%s:443" $gatewayHost) }}
                    tls:
                      mode: Mutual
                      serverName: {{ printf "%q" $gateway.spec.host }}
                  signalsEndpoint:
                    address: {{ printf "%q" (printf "%s:443" $signalsHost) }}
                    serverName: {{ printf "%q" $signals.spec.host }}
