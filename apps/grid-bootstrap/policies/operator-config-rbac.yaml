# The operator watches grid-operator-config, which the membership policy writes. The platform
# grants only get until the Grid manifests carry role-operator-config; remove this then.
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: grid-operator-config-reader
  namespace: redhat-ai-grid
placementRef:
  apiGroup: cluster.open-cluster-management.io
  kind: Placement
  name: grid-bootstrap-membership
subjects:
  - apiGroup: policy.open-cluster-management.io
    kind: Policy
    name: grid-operator-config-reader
---
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: grid-operator-config-reader
  namespace: redhat-ai-grid
spec:
  disabled: false
  remediationAction: enforce
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: grid-operator-config-reader
        spec:
          remediationAction: enforce
          severity: high
          pruneObjectBehavior: DeleteIfCreated
          evaluationInterval:
            compliant: watch
            noncompliant: watch
          object-templates:
            - complianceType: mustonlyhave
              objectDefinition:
                apiVersion: rbac.authorization.k8s.io/v1
                kind: Role
                metadata:
                  name: grid-operator-config-reader
                  namespace: redhat-ai-grid
                rules:
                  - apiGroups: [""]
                    resources: [configmaps]
                    resourceNames: [grid-operator-config]
                    verbs: [get, list, watch]
            - complianceType: mustonlyhave
              objectDefinition:
                apiVersion: rbac.authorization.k8s.io/v1
                kind: RoleBinding
                metadata:
                  name: grid-operator-config-reader
                  namespace: redhat-ai-grid
                subjects:
                  - kind: ServiceAccount
                    name: grid-operator
                    namespace: redhat-ai-grid
                roleRef:
                  apiGroup: rbac.authorization.k8s.io
                  kind: Role
                  name: grid-operator-config-reader
