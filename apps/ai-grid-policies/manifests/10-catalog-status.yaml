# Read-only status of the provider console's catalog (apps/acm-models),
# reported back to the hub so the console's backend can show what is actually
# running: Argo CD only reports that it applied the files, not that a model
# came up.
#
# Both Policies are inform-only: they change nothing on a cluster. Each
# ConfigurationPolicy looks up every object of one kind in one namespace, with
# a managed-cluster template, and checks its readiness, so it lists no names
# and needs no change when the catalog changes. A namespace with none of the
# kind is Compliant.
#
# The backend reads each cluster's copy (namespace <cluster>, name
# ai-grid-policies.<policy>) and takes the per-object result from the status
# message, for example "llminferenceservices [a, b] found as specified in
# namespace ai-grid-internal-models". The namespace, Policy and
# ConfigurationPolicy names are that contract (the backend's defaults).
#
# Ported from ai-grid-cloud/ai-grid-env-setup 7634e7f (apps/ai-grid-policies,
# Apache-2.0).
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: ai-grid-models-status
  namespace: ai-grid-policies
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  remediationAction: inform
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: models-ready
        spec:
          severity: low
          object-templates-raw: |
            {{- range (lookup "serving.kserve.io/v1alpha2" "LLMInferenceService" "ai-grid-internal-models" "").items }}
            - complianceType: musthave
              objectDefinition:
                apiVersion: serving.kserve.io/v1alpha2
                kind: LLMInferenceService
                metadata: { name: '{{ .metadata.name }}', namespace: '{{ .metadata.namespace }}' }
                status: { conditions: [{ type: Ready, status: "True" }] }
            {{- end }}
---
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: ai-grid-catalog-status
  namespace: ai-grid-policies
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  remediationAction: inform
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: auth-policies-active
        spec:
          severity: low
          object-templates-raw: |
            {{- range (lookup "maas.opendatahub.io/v1alpha1" "MaaSAuthPolicy" "models-as-a-service" "").items }}
            - complianceType: musthave
              objectDefinition:
                apiVersion: maas.opendatahub.io/v1alpha1
                kind: MaaSAuthPolicy
                metadata: { name: '{{ .metadata.name }}', namespace: '{{ .metadata.namespace }}' }
                status: { phase: Active }
            {{- end }}
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: external-models-ready
        spec:
          severity: low
          object-templates-raw: |
            {{- range (lookup "inference.opendatahub.io/v1alpha1" "ExternalModel" "models-as-a-service" "").items }}
            - complianceType: musthave
              objectDefinition:
                apiVersion: inference.opendatahub.io/v1alpha1
                kind: ExternalModel
                metadata: { name: '{{ .metadata.name }}', namespace: '{{ .metadata.namespace }}' }
                status: { phase: Ready }
            {{- end }}
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: model-refs-ready
        spec:
          severity: low
          object-templates-raw: |
            {{- range (lookup "maas.opendatahub.io/v1alpha1" "MaaSModelRef" "models-as-a-service" "").items }}
            - complianceType: musthave
              objectDefinition:
                apiVersion: maas.opendatahub.io/v1alpha1
                kind: MaaSModelRef
                metadata: { name: '{{ .metadata.name }}', namespace: '{{ .metadata.namespace }}' }
                status: { phase: Ready }
            {{- end }}
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: subscriptions-active
        spec:
          severity: low
          object-templates-raw: |
            {{- range (lookup "maas.opendatahub.io/v1alpha1" "MaaSSubscription" "models-as-a-service" "").items }}
            - complianceType: musthave
              objectDefinition:
                apiVersion: maas.opendatahub.io/v1alpha1
                kind: MaaSSubscription
                metadata: { name: '{{ .metadata.name }}', namespace: '{{ .metadata.namespace }}' }
                status: { phase: Active }
            {{- end }}
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: ai-grid-catalog-status
  namespace: ai-grid-policies
  annotations:
    argocd.argoproj.io/sync-wave: "3"
placementRef:
  apiGroup: cluster.open-cluster-management.io
  kind: Placement
  name: ai-grid-policies
subjects:
  - apiGroup: policy.open-cluster-management.io
    kind: Policy
    name: ai-grid-models-status
  - apiGroup: policy.open-cluster-management.io
    kind: Policy
    name: ai-grid-catalog-status
