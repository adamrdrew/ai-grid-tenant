apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  # AI Grid's ACM Policies on the hub that the provider console reads. It is
  # discovered automatically by the bootstrap ApplicationSet.
  name: ai-grid-policies
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/kahowell/ai-grid-tenant.git
    targetRevision: HEAD
    path: apps/ai-grid-policies/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
